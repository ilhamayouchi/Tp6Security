<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un utilisateur</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
        .card { max-width: 420px; margin: auto; background: #fff; padding: 24px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 9px 18px; background: #4f46e5;
            color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        .error { color: #b00020; font-size: .9rem; }
    </style>
</head>
<body>
<div class="card">
    <h1>Ajouter un utilisateur</h1>

    <form th:action="@{/adduser}" th:object="${user}" method="post" novalidate>
        <label for="name">Nom :</label>
        <input type="text" id="name" th:field="*{name}" />
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <label for="email">Email :</label>
        <input type="email" id="email" th:field="*{email}" />
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <button type="submit">Enregistrer</button>
    </form>

    <p><a th:href="@{/}">Retour à la liste</a></p>
</div>
</body>
</html>
